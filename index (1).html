  <P> 命题一：月球始终以同一面朝向地球，是因为月球的公转周期和自转周期完全同步，属于天然潮汐锁定现象，月球不存在绝对的“背面永久黑暗”。
</P>
  <P>命题二：月球表面的环形山绝大多数形成于小行星、陨石撞击，少数由远古火山活动形成，月球没有大气层，因此无法缓冲天体撞击。</P>
  <P>命题三：月相的阴晴圆缺是由地球遮挡太阳光造成的，新月阶段代表月球完全进入地球的阴影区域。</P>
  <P>命题四：月球自身不发光、不发热，我们肉眼看到的月光，是月球表面反射的太阳光，月光不存在自主光源。</P>
